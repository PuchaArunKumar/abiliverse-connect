name: Deploy to GitHub Pages

# Pull requests run the tests and the build, so a regression is caught before
# it merges; only pushes to main (and manual runs) publish the site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what Pages needs.
permissions:
  contents: read

# Deploys queue rather than cancel, so a half-published site never goes live.
# Pull request runs get their own group and a newer push supersedes an older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Includes the axe-core accessibility checks in src/test/a11y.test.tsx.
      - run: npm test

      # Pages serves project sites under /<repo>/, so assets and the router
      # need that base path. The Supabase values come from the committed .env.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Pages has no SPA rewrites: serve the app for unknown paths so deep
      # links like /problems/123 load instead of returning GitHub's 404.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
